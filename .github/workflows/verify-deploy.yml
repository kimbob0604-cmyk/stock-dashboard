name: 배포 후 실측

# 머지 → Render 자동 배포 후, 실제로 값이 채워졌는지 숫자로 확인한다.
# "고쳤다" 는 이 워크플로 출력으로만 말한다.
#
# 배포 완료 감지는 /api/health 의 git_commit 을 github.sha 와 맞춰 본다.
# 엔드포인트 존재 여부나 특정 값의 변화로 짐작하던 방식은 '이미 있던 경로를
# 고친 배포' 에서 통하지 않았다. verify_deploy.py --wait 참조.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      URL: ${{ vars.DASHBOARD_URL || 'https://stock-dashboard-kc23.onrender.com' }}
      # verify_deploy.py 가 data.json 재생성(POST)을 찌를 때 쓴다.
      OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 새 코드가 떴는지 기다린다
        run: python3 scripts/verify_deploy.py "$URL" --wait "${{ github.sha }}"

      - name: 수집 트리거 (배포 직후엔 아직 안 돌았다)
        run: |
          set -u
          echo "수급 배치 수동 트리거 (top_n=80)"
          curl -s -X POST --max-time 60 "$URL/api/flow/refresh-batch?top_n=80" | head -c 300
          echo
      - name: 수급 배치 완료 대기
        run: python3 scripts/verify_deploy.py "$URL" --wait-flow

      - name: data.json 서버 생성 대기
        run: python3 scripts/verify_deploy.py "$URL" --wait-datajson

      - name: 실측
        run: python3 scripts/verify_deploy.py "$URL"
