name: 수집기 검증

# 개발 컨테이너는 네이버가 프록시에 막혀 있다. 새 수집기가 실제로 도는지
# 러너에서 **server.py 의 진짜 함수로** 확인한다. 배포 전 관문이다.

on:
  workflow_dispatch:
  push:
    paths:
      - 'server.py'
      - 'kis_api.py'
      - 'scripts/check_flow_kis_today.py'
      - 'scripts/test_collectors.py'
      - 'scripts/test_data_json.py'
      - 'scripts/check_boot_after_fork.py'
      - 'scripts/check_scheduler_liveness.py'
      - 'scripts/check_naver_universe.py'
      - 'stock_master.py'
      - 'ohlcv_autofill.py'
      - 'newhigh.py'
      - 'market_risk.py'
      - 'movers.py'
      - 'disclosure_category.py'
      - 'scripts/check_disclosures.py'
      - 'scripts/check_movers.py'
      - 'scripts/check_new_high_logic.py'
      - 'db_backup.py'
      - 'scripts/check_market_risk.py'
      - 'valuechain.py'
      - 'revision_calculator.py'
      - 'consensus_collector.py'
      - 'consensus_snapshot_collector.py'
      - 'data_freshness.py'
      - 'tam_modeler.py'
      - 'static/js/**'
      - '.github/workflows/collector-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 의존성
        run: pip install -q -r requirements.txt
      - name: 수집기 검증
        run: python3 scripts/test_collectors.py
      - name: 위험지표·ADR 검증 (합성 DB)
        run: python3 scripts/check_market_risk.py
      - name: 신고가·등락률 화면 검증 (합성 DB)
        run: python3 scripts/check_movers.py
      - name: 공시 카테고리·API 검증 (진짜 server.py)
        run: python3 scripts/check_disclosures.py
      - name: 신고가 판정 검증 (리츠·스팩 제외 포함)
        run: python3 scripts/check_new_high_logic.py
      - name: data.json 생성기 검증
        run: python3 scripts/test_data_json.py
      - name: 부팅 위치 검증 (gunicorn preload 여도 워커에서 시작)
        run: python3 scripts/check_boot_after_fork.py
      - name: 스케줄러 감시·심장박동 검증
        run: python3 scripts/check_scheduler_liveness.py
      - name: 16:00 수급 KIS 당일 잠정 행 검증 (가짜 응답)
        run: python3 scripts/check_flow_kis_today.py
      # 업종 유니버스가 100개 넘는 업종·영숫자 코드(0126Z0)를 흘리지 않는가.
      # 가짜 응답으로 한 번, 러너에서 진짜 네이버로 한 번.
      - name: 네이버 업종 유니버스 검증
        run: python3 scripts/check_naver_universe.py --live
