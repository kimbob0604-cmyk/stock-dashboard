name: 수집기 검증

# 개발 컨테이너는 네이버가 프록시에 막혀 있다. 새 수집기가 실제로 도는지
# 러너에서 **server.py 의 진짜 함수로** 확인한다. 배포 전 관문이다.

on:
  workflow_dispatch:
  push:
    paths:
      - 'server.py'
      - 'kis_api.py'
      - 'scripts/check_flow_kis_today.py'
      - 'scripts/test_collectors.py'
      - 'scripts/test_data_json.py'
      - 'scripts/check_boot_after_fork.py'
      - 'scripts/check_scheduler_liveness.py'
      - '.github/workflows/collector-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 의존성
        run: pip install -q -r requirements.txt
      - name: 수집기 검증
        run: python3 scripts/test_collectors.py
      - name: data.json 생성기 검증
        run: python3 scripts/test_data_json.py
      - name: 부팅 위치 검증 (gunicorn preload 여도 워커에서 시작)
        run: python3 scripts/check_boot_after_fork.py
      - name: 스케줄러 감시·심장박동 검증
        run: python3 scripts/check_scheduler_liveness.py
      - name: 16:00 수급 KIS 당일 잠정 행 검증 (가짜 응답)
        run: python3 scripts/check_flow_kis_today.py
