name: 시황 수동 발송

# 손으로 돌리는 구제 수단이다. 자동 경로(16:00 cron + 캐치업)가 못 보냈거나,
# 덜 찬 시황이 나가 버린 날에 쓴다 — 2026-09-18 에 일봉이 비어 신고가가
# '데이터 수집 실패' 로 나갔던 그런 날.
#
# 하는 일은 셋이다.
#   1) 잠든 인스턴스를 깨운다 (Render 무료 플랜은 15분 유휴면 잔다).
#   2) /api/ops/brief/closing 을 두드린다. 일봉이 비었으면 서버가 **먼저
#      채우고**(300종목 약 5분) 그 다음에 보낸다.
#   3) 끝날 때까지 30초마다 일봉 현황을 찍는다. 이 폴링이 곧 인스턴스를
#      깨어 있게 하는 트래픽이라 **없으면 채우는 도중에 잠든다.**
#
# 저절로 돌지 않는다 — 자동 발송을 두 곳에서 하면 중복이 된다.

on:
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 이미 보냈어도 다시 보낸다'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: brief-kick
  cancel-in-progress: false

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 깨우고 보내고 지켜본다
        env:
          URL: ${{ vars.DASHBOARD_URL || 'https://stock-dashboard.onrender.com' }}
          FORCE: ${{ inputs.force }}
        run: |
          set -u
          echo "대상 $URL"

          # ── 1) 깨우기 ──
          awake=0
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
                        "$URL/api/health" || echo 000)
            echo "깨우기 $i — HTTP $code"
            [ "$code" = "200" ] && { awake=1; break; }
            sleep 20
          done
          if [ "$awake" != "1" ]; then
            echo "::error::$URL 를 깨우지 못했습니다 (저장소 변수 DASHBOARD_URL 확인)."
            exit 1
          fi

          # ── 2) 발송 요청 ──
          q=''
          [ "$FORCE" = "true" ] && q='?force=1'
          echo "POST /api/ops/brief/closing$q"
          curl -s --max-time 60 -X POST "$URL/api/ops/brief/closing$q" | head -c 600
          echo

          # ── 3) 일봉이 차는 것을 지켜본다 (동시에 인스턴스를 깨워 둔다) ──
          # 300종목 약 5분. 넉넉히 20분을 본다. 행이 늘다가 2분 넘게 멈추고
          # 종목 수가 충분하면 끝난 것으로 본다.
          last=0; still=0
          for i in $(seq 1 40); do
            sleep 30
            body=$(curl -s --max-time 60 "$URL/api/ops/ohlcv/status" || echo '{}')
            rows=$(printf '%s' "$body" | python3 -c \
              'import json,sys;print((json.load(sys.stdin) or {}).get("rows") or 0)' \
              2>/dev/null || echo 0)
            codes=$(printf '%s' "$body" | python3 -c \
              'import json,sys;print((json.load(sys.stdin) or {}).get("codes") or 0)' \
              2>/dev/null || echo 0)
            echo "$(date -u +%H:%M:%SZ) 일봉 ${rows}행 / ${codes}종목"
            if [ "$rows" = "$last" ]; then
              still=$((still + 1))
            else
              still=0
            fi
            last=$rows
            if [ "$still" -ge 4 ] && [ "$codes" -ge 100 ]; then
              echo "채움이 끝난 것으로 봅니다 — ${rows}행 / ${codes}종목"
              break
            fi
          done

          if [ "$last" -le 0 ]; then
            echo "::error::일봉이 한 행도 안 들어왔습니다. 서버 로그의 '[일봉 채움]' 줄을 보세요."
            exit 1
          fi
          echo "일봉 ${last}행 — 텔레그램을 확인하세요."
